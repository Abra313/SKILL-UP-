<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10383a">
    <meta name="description" content="SKILL-UP local administration dashboard prototype.">
    <title>Admin dashboard — SKILL-UP</title>
    <link rel="icon" type="image/png" href="assets/skill-up-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css?v=2">
  </head>
  <body>
    <div class="admin-app">
      <aside class="sidebar" id="sidebar">
        <a class="sidebar-brand" href="index.html" aria-label="SKILL-UP home">
          <img src="assets/skill-up-logo.png" alt="SKILL-UP">
          <span>ADMIN</span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="side-nav" aria-label="Admin navigation">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
          <button class="nav-item" data-view="courses"><span class="nav-icon">▤</span>Courses</button>
          <button class="nav-item" data-view="students"><span class="nav-icon">♙</span>Students</button>
          <button class="nav-item" data-view="finance"><span class="nav-icon">₦</span>Payments &amp; finance</button>
          <button class="nav-item" data-view="referrals"><span class="nav-icon">↗</span>Referrals</button>
          <button class="nav-item" data-view="mentorship"><span class="nav-icon">◎</span>Mentorship</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings &amp; security</button>
        </nav>
        <div class="sidebar-bottom">
          <a class="sidebar-site-link" href="index.html"><span>↖</span> View public website</a>
          <div class="admin-profile"><span class="avatar avatar-admin" id="admin-profile-initials">AD</span><div><strong id="admin-profile-name">Administrator</strong><small>Administrator</small></div><span class="profile-dots">···</span></div>
        </div>
      </aside>

      <div class="main-shell">
        <header class="topbar">
          <button class="mobile-menu" type="button" aria-label="Open admin navigation" aria-expanded="false">☰</button>
          <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="current-page">Dashboard</strong></div>
          <div class="topbar-actions"><button class="icon-button" id="topbar-date" type="button" aria-label="Today's date">◷</button><a class="admin-site-button" href="index.html">View website</a><a class="admin-site-button" href="auth.html?mode=login" data-sign-out>Sign out</a></div>
        </header>
        <main class="main-content" id="main-content" tabindex="-1"></main>
      </div>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div class="modal-layer" id="modal-layer" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header"><div><p class="modal-eyebrow">SKILL-UP ADMIN</p><h2 id="modal-title"></h2></div><button class="icon-button modal-close" type="button" data-close-modal aria-label="Close dialog">×</button></div>
        <div class="modal-body" id="modal-body"></div>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-store.js"></script>
    <script src="ai-course-catalog.js?v=2"></script>
    <script src="admin.js?v=4"></script>
  </body>
</html>
